services:
  server:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - db-data:/app/data
      - uploads:/app/uploads
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=file:/app/data/parcel-hub.db
      - UPLOAD_DIR=/app/uploads
      - NODE_ENV=production

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  db-data:
  uploads:
